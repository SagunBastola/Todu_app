<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster - Todo App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2 rounded-lg shadow-md shadow-indigo-200">
                    <i class="fa-solid fa-list-check text-xl"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">TaskMaster</h1>
            </div>
            <button onclick="openModal()" class="cursor-pointer bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg transition-colors flex items-center gap-2 shadow-md shadow-indigo-100">
                <i class="fa-solid fa-plus"></i> New Task
            </button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-8">
        
        <section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="relative md:col-span-2">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="searchInput" oninput="searchTasks()" placeholder="Search tasks by keyword..." 
                    class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl focus:outline-hidden focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm">
            </div>

            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                    <i class="fa-solid fa-filter"></i>
                </span>
                <select id="priorityFilter" onchange="filterByPriority()" 
                    class="cursor-pointer w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl focus:outline-hidden focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm appearance-none">
                    <option value="">All Priorities</option>
                    <option value="High">🔥 High Priority</option>
                    <option value="Medium">⚡ Medium Priority</option>
                    <option value="Low">💤 Low Priority</option>
                </select>
            </div>
        </section>

        <section>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500" id="listTitle">All Tasks</h2>
                <span id="taskCount" class="bg-slate-200 text-slate-700 text-xs font-bold px-2.5 py-1 rounded-full">0</span>
            </div>
            
            <div id="tasksContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                </div>

            <div id="emptyState" class="hidden text-center py-16 bg-white rounded-2xl border border-dashed border-slate-200">
                <div class="text-slate-300 text-5xl mb-3">
                    <i class="fa-solid fa-folder-open"></i>
                </div>
                <p class="text-slate-500 font-medium">No tasks found match your criteria.</p>
                <p class="text-slate-400 text-xs mt-1">Try resetting filters or add a new task to get started.</p>
            </div>
        </section>
    </main>

    <div id="taskModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full shadow-xl transform transition-all border border-slate-100">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-900">Create New Task</h3>
                <button onclick="closeModal()" class="cursor-pointer text-slate-400 hover:text-slate-600 rounded-lg p-1 hover:bg-slate-50">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <form id="taskForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
                <input type="hidden" id="taskId">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Task Title *</label>
                    <input type="text" id="taskTitle" required minlength="1" maxlength="40" placeholder="e.g., Fix database migration" 
                        class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-hidden focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Description</label>
                    <textarea id="taskDescription" rows="3" placeholder="Add some context details..." 
                        class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-hidden focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-sm"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Priority *</label>
                    <select id="taskPriority" required class="cursor-pointer w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-hidden focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-sm">
                        <option value="High">High</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeModal()" class="cursor-pointer px-4 py-2 border border-slate-200 text-slate-600 hover:bg-slate-50 font-medium rounded-lg text-sm transition-colors">
                        Cancel
                    </button>
                    <button type="submit" class="cursor-pointer px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm transition-colors shadow-md shadow-indigo-100">
                        Save Task
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Update this URL if your FastAPI backend is hosted on a different port/address
        const API_BASE_URL = 'https://todu-app.onrender.com';

        // Fetch and render list on initial load
        document.addEventListener('DOMContentLoaded', () => {
            fetchAndRenderTasks(`${API_BASE_URL}/tasks/search?name=`); // Using broad search to get all initially, change query based on your schema default setup
        });

        // Dynamic API Fetch and DOM population
        async function fetchAndRenderTasks(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('API request failed');
                
                let tasks = await response.json();
                
                // Edge case handling if backend returns a single object instead of an array (like in your ID lookup endpoint)
                if (!Array.isArray(tasks)) {
                    tasks = tasks ? [tasks] : [];
                }

                renderTasks(tasks);
            } catch (error) {
                console.error('Error fetching tasks:', error);
                alert('Could not sync with the task backend service.');
            }
        }

        function renderTasks(tasks) {
            const container = document.getElementById('tasksContainer');
            const emptyState = document.getElementById('emptyState');
            document.getElementById('taskCount').innerText = tasks.length;

            container.innerHTML = '';

            if (tasks.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            tasks.forEach(task => {
                // Priority color badges logic
                let badgeClass = 'bg-slate-100 text-slate-700';
                if(task.priority === 'High') badgeClass = 'bg-rose-50 text-rose-700 border border-rose-100';
                if(task.priority === 'Medium') badgeClass = 'bg-amber-50 text-amber-700 border border-amber-100';
                if(task.priority === 'Low') badgeClass = 'bg-emerald-50 text-emerald-700 border border-emerald-100';

                // Format timestamp gently
                const dateStr = task.created_at ? new Date(task.created_at).toLocaleDateString() : 'No date';

                const card = `
                    <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-xs hover:shadow-md transition-all flex flex-col justify-between group">
                        <div>
                            <div class="flex justify-between items-start gap-2 mb-2">
                                <span class="text-xs font-bold px-2 py-0.5 rounded-md ${badgeClass}">
                                    ${task.priority}
                                </span>
                                <span class="text-slate-400 text-xs"><i class="fa-regular fa-clock mr-1"></i>${dateStr}</span>
                            </div>
                            <h3 class="font-bold text-slate-900 text-base mb-1">${task.name || task.title || 'Untitled Task'}</h3>
                            <p class="text-slate-500 text-sm line-clamp-3">${task.description || 'No description provided.'}</p>
                        </div>
                        <div class="flex justify-end gap-2 mt-4 pt-3 border-t border-slate-50 opacity-90 group-hover:opacity-100 transition-opacity">
                            <button onclick="prepareUpdateTask(${JSON.stringify(task).replace(/"/g, '&quot;')})" class="cursor-pointer text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 p-2 rounded-lg text-xs font-semibold flex items-center gap-1 transition-all">
                                <i class="fa-solid fa-pen"></i> Edit
                            </button>
                            <button onclick="deleteTaskItem(${task.id})" class="cursor-pointer text-slate-600 hover:text-rose-600 hover:bg-rose-50 p-2 rounded-lg text-xs font-semibold flex items-center gap-1 transition-all">
                                <i class="fa-solid fa-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', card);
            });
        }

        // Live Search Handler
        function searchTasks() {
            const query = document.getElementById('searchInput').value;
            document.getElementById('priorityFilter').value = ""; // Reset filter
            document.getElementById('listTitle').innerText = query ? `Search results for "${query}"` : "All Tasks";
            
            // Matches your @app.get("/tasks/search")
            fetchAndRenderTasks(`${API_BASE_URL}/tasks/search?name=${encodeURIComponent(query)}`);
        }

        // Dropdown Filter Handler 
        function filterByPriority() {
            const priority = document.getElementById('priorityFilter').value;
            document.getElementById('searchInput').value = ""; // Reset search
            document.getElementById('listTitle').innerText = priority ? `${priority} Priority Tasks` : "All Tasks";

            if (!priority) {
                fetchAndRenderTasks(`${API_BASE_URL}/tasks/search?name=`);
                return;
            }
            // Matches your @app.get("/tasks")
            fetchAndRenderTasks(`${API_BASE_URL}/tasks?priority=${priority}`);
        }

        // Form Submit Handler (Saves or Creates)
        async function handleFormSubmit(event) {
            event.preventDefault();
            
            const id = document.getElementById('taskId').value;
            const title = document.getElementById('taskTitle').value;
            const description = document.getElementById('taskDescription').value;
            const priority = document.getElementById('taskPriority').value;

            // Notice your schema mappings may look for 'name' or 'title'. 
            // Change payload fields below to match exactly whatever structure your pydantic `Task` schema expects.
            const payload = {
                name: title, 
                description: description,
                priority: priority
            };

            try {
                let response;
                if (id) {
                    // Matches your @app.put("/tasks/{task_id}")
                    response = await fetch(`${API_BASE_URL}/tasks/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } else {
                    // Matches your @app.post("/tasks")
                    response = await fetch(`${API_BASE_URL}/tasks`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }

                if (!response.ok) throw new Error('Failed to process task data');
                
                closeModal();
                // Refresh list
                fetchAndRenderTasks(`${API_BASE_URL}/tasks/search?name=`);
            } catch (error) {
                console.error(error);
                alert('An error occurred while saving the task.');
            }
        }

        // Delete Handler
        async function deleteTaskItem(id) {
            if (!confirm('Are you sure you want to discard this task?')) return;

            try {
                // Matches your @app.delete("/tasks/{task_id}")
                const response = await fetch(`${API_BASE_URL}/tasks/${id}`, {
                    method: 'DELETE'
                });
                if (!response.ok) throw new Error('Failed to delete');
                
                fetchAndRenderTasks(`${API_BASE_URL}/tasks/search?name=`);
            } catch (error) {
                console.error(error);
                alert('Could not delete the task item.');
            }
        }

        // Modal Utilities
        function openModal() {
            document.getElementById('modalTitle').innerText = "Create New Task";
            document.getElementById('taskForm').reset();
            document.getElementById('taskId').value = "";
            document.getElementById('taskModal').classList.remove('hidden');
        }

        function prepareUpdateTask(task) {
            document.getElementById('modalTitle').innerText = "Modify Task Configuration";
            document.getElementById('taskId').value = task.id;
            document.getElementById('taskTitle').value = task.name || task.title || '';
            document.getElementById('taskDescription').value = task.description || '';
            document.getElementById('taskPriority').value = task.priority || 'Medium';
            document.getElementById('taskModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('taskModal').classList.add('hidden');
        }
    </script>
</body>
</html>
